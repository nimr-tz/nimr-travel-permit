# NIMR Internal Travel Permit -- Apache virtual host (XAMPP / local development)
#
# The application root MUST NOT be served directly. Only ./public may be
# exposed. Serving the project folder from C:/xampp/htdocs makes .env, the
# SQLite database, storage/logs, and private handover uploads fetchable over
# HTTP.
#
# Install:
#   1. Append this file to C:/xampp/apache/conf/extra/httpd-vhosts.conf
#      (or add: Include "C:/xampp/htdocs/Internal Travel Permit/docs/apache-vhost.conf")
#   2. Restart Apache.
#   3. Browse http://localhost:8080
#
# Port 8080 is used so the default port 80 vhost for C:/xampp/htdocs keeps
# working for other projects.

Listen 8080

<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs/Internal Travel Permit/public"

    <Directory "C:/xampp/htdocs/Internal Travel Permit/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  "logs/nimr-travel-permit-error.log"
    CustomLog "logs/nimr-travel-permit-access.log" common
</VirtualHost>
